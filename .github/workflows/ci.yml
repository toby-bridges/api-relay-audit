name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Check version surfaces
        run: python3 scripts/sync-version.py --check

      - name: Check CI command deadlines
        run: python3 -m unittest discover -s scripts -p test_run_ci_command.py -v

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Check standalone help works without site packages
        run: python3 -S audit.py --help

  dsh-plugin-unit:
    name: DSH plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run DSH adapter tests
        run: npm run test:dsh

      - name: Check key-env and version integration
        run: >-
          python -m pytest
          tests/test_dual_distribution_parity.py
          tests/test_version_sync.py
          -q

      - name: Inspect prebuilt bundle contents
        run: npm pack --dry-run

  dsh-plugin-composition:
    name: DSH 0.1.0-rc.6 composition
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"

      - name: Set isolated DSH paths
        shell: bash
        run: |
          printf '%s\n' \
            "DSH_HOME=$RUNNER_TEMP/dsh-home" \
            "DSH_CLI=$RUNNER_TEMP/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            >> "$GITHUB_ENV"

      # Install once: later commands execute this exact CLI directly rather
      # than entering npm's resolution/cache path again through npx.
      - name: Install pinned DSH CLI
        run: >-
          python3 scripts/run-ci-command.py --name install-dsh-cli --timeout 600 --
          npm install --prefix "${{ runner.temp }}/dsh-cli"
          --no-audit --no-fund @deepseek-ai/dsh@0.1.0-rc.6

      - name: Compose official Web profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ci-command.py --name web-add --timeout 900 -- \
            node "$DSH_CLI" plugin --profile web add .
          python3 scripts/run-ci-command.py --name web-dump-config --timeout 60 -- \
            node "$DSH_CLI" --profile web --dump-config > web-config.txt
          grep -q "api-relay-audit" web-config.txt

      - name: Install official cc-tui profile
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/run-ci-command.py --name cc-tui-install --timeout 300 -- \
            node "$DSH_CLI" plugin --profile cc-tui add dsh-cc-tui@0.4.1 || status=$?
          if [ "$status" -ne 0 ]; then
            # Only the known pnpm build-policy failure permits this recovery;
            # a timed-out or otherwise failed install must remain a failure.
            if [ "$status" -eq 124 ] || [ "$status" -ge 128 ]; then exit "$status"; fi
            profile="$DSH_HOME/profiles/cc-tui"
            grep -q "koffi: set this to true or false" "$profile/pnpm-workspace.yaml"
            sed -i 's/koffi: set this to true or false/koffi: true/' "$profile/pnpm-workspace.yaml"
            python3 scripts/run-ci-command.py --name cc-tui-koffi-install --timeout 180 -- \
              pnpm --dir "$profile" install
          fi

      - name: Compose official cc-tui profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ci-command.py --name cc-tui-add --timeout 300 -- \
            node "$DSH_CLI" plugin --profile cc-tui add .
          python3 scripts/run-ci-command.py --name cc-tui-dump-config --timeout 60 -- \
            node "$DSH_CLI" --profile cc-tui --dump-config > cc-tui-config.txt
          grep -q "api-relay-audit" cc-tui-config.txt

      - name: Retain composition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-composition-configs
          path: |
            web-config.txt
            cc-tui-config.txt
          if-no-files-found: ignore
