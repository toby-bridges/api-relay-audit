name: DSH Plugin Feedback / DSH 插件反馈
description: Report DeepSeek Harness plugin install and usage feedback / 提交 DeepSeek Harness 插件安装使用反馈
title: "[DSH Plugin] "
labels: ["documentation", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Use this primarily for DeepSeek Harness plugin install and runtime feedback. Retained OpenClaw or Hermes integration feedback is also accepted.

        Do not paste API keys, shell history containing secrets, private relay URLs, wallet material, or raw traffic captures.

  - type: dropdown
    id: skill_target
    attributes:
      label: Integration Target
      options:
        - DeepSeek Harness web profile
        - DeepSeek Harness cc-tui profile
        - retained OpenClaw integration
        - retained Hermes Agent integration
        - not sure
    validations:
      required: true

  - type: textarea
    id: command_used
    attributes:
      label: Command Used
      description: Paste the install or run command after removing secrets.
      placeholder: |
        dsh plugin --profile web add "github:toby-bridges/api-relay-audit#v2.4.0"
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result
      description: What happened? Include sanitized error text when useful.
      placeholder: |
        Expected:
        Actual:
        Error text, if any:
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, DSH/client version, profile, and anything relevant.
      placeholder: "macOS, zsh, DSH 0.1.0-rc.6, web profile"
